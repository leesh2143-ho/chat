<!DOCTYPE html>
<html>
  <head>
    <title>Socket.IO chat</title>
    <style>
      body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      #status { position: fixed; top: 0; left: 0; right: 0; padding: 0.5rem; background: #eee; text-align: center; }
      #form { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
      #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; }
      #input:focus { outline: none; }
      #form > button { background: #333; border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: #fff; }
      .main-content { margin-top: 3rem; } /* Push content below the status bar */
      #messages { list-style-type: none; margin: 0; padding: 0; margin-bottom: 3rem; }
      #messages > li { padding: 0.5rem 1rem; }
      .system-message { color: grey; font-style: italic; text-align: center; }
      .my-message { text-align: right; background-color: #dcf8c6; margin-left: auto; border-radius: 10px; max-width: 60%; width: fit-content; }
      .other-message { text-align: left; background-color: #fff; margin-right: auto; border-radius: 10px; max-width: 60%; width: fit-content; }
    </style>
  </head>
  <body>
    <div id="status">Connecting...</div>
    <div class="main-content">
      <div id="room-controls">
        <input id="room-id" autocomplete="off" placeholder="Enter Room ID" />
        <button id="join-room">Join Room</button>
      </div>
      <ul id="messages"></ul>
    </div>
    <form id="form" action="">
      <textarea id="input" autocomplete="off"></textarea><button>Send</button>
    </form>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js"></script>
  </body>
</html>
